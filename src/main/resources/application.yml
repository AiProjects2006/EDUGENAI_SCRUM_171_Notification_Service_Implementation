
server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: notification-service

notification:
  local:
    enabled: true

  delivery:
    mode: ${NOTIFICATION_DELIVERY_MODE:console}

  sqs:
    enabled: ${NOTIFICATION_SQS_ENABLED:false}
    queue-url: ${NOTIFICATION_SQS_QUEUE_URL:}
    poll-interval-ms: ${NOTIFICATION_SQS_POLL_INTERVAL_MS:5000}

logging:
  level:
    com.ailearning.notificationservice: INFO
