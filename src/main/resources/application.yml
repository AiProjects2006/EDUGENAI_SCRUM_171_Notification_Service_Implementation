
server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: notification-service

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/notification_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
notification:
  local:
    enabled: true

  delivery:
    mode: ${NOTIFICATION_DELIVERY_MODE:database}

  sqs:
    enabled: ${NOTIFICATION_SQS_ENABLED:false}
    queue-url: ${NOTIFICATION_SQS_QUEUE_URL:}
    poll-interval-ms: ${NOTIFICATION_SQS_POLL_INTERVAL_MS:5000}

logging:
  level:
    com.ailearning.notificationservice: INFO
